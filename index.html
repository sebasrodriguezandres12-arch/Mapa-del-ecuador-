<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ecuador Interactivo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07131c;color:#eef7fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{height:76px;padding:15px 22px;background:#0b1b26;border-bottom:1px solid #29404d;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:25px} header small{color:#91a8b5}
.app{display:grid;grid-template-columns:245px minmax(420px,1fr) 360px;min-height:calc(100vh - 76px)}
aside,.details{background:#0b1b26;padding:15px;border-right:1px solid #29404d}
.details{border-left:1px solid #29404d;border-right:0}
input,select{width:100%;padding:11px;border:1px solid #34515e;border-radius:10px;background:#102630;color:white;margin-bottom:10px}
.list{height:calc(100vh - 160px);overflow:auto}
.prov{padding:9px;border-radius:8px;color:#b7c9d1;cursor:pointer;margin:2px 0}
.prov:hover,.prov.active{background:#1e6370;color:#fff}
.mapbox{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#173b4b,#07131c 72%)}
svg{width:96%;height:calc(100vh - 105px);min-height:590px}
.province{fill:#2c7481;stroke:#e4f2f4;stroke-width:1.2;cursor:pointer;transition:.15s}
.province:hover{fill:#63b6ae;stroke:white;stroke-width:2}
.province.selected{fill:#f0a548;stroke:white;stroke-width:2.5}
.label{fill:white;font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.tools{position:absolute;right:16px;top:16px;display:flex;gap:6px}
.tools button{background:#102630;color:#fff;border:1px solid #42606c;border-radius:8px;padding:8px 12px;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0}
.tab{background:#102630;color:#c9d8de;border:1px solid #34515e;border-radius:8px;padding:7px 9px;cursor:pointer}
.tab.active{background:#256d79;color:white}
.card{background:#102630;border:1px solid #294955;border-radius:11px;padding:12px;margin:8px 0}
.card b{display:block;color:#72c5c7;font-size:11px;text-transform:uppercase;margin-bottom:5px}
.card p{margin:0;line-height:1.45}
.math-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}.math-table th,.math-table td{border:1px solid #34515e;padding:7px;text-align:center}.math-table th{background:#173b4b}.math-note{color:#b7c9d1;font-size:12px;line-height:1.4}
.muted{color:#91a8b5;font-size:13px}
.legend{position:absolute;bottom:15px;left:15px;background:#0b1b26dd;padding:8px 11px;border-radius:8px;font-size:12px}
@media(max-width:1050px){.app{grid-template-columns:200px 1fr}.details{grid-column:1/-1;border-top:1px solid #29404d}.list{height:230px}svg{height:600px}}
@media(max-width:700px){.app{display:block}.list{height:170px}svg{height:520px}.details{border-top:1px solid #29404d}}
</style>
</head>
<body>
<header>
<div><h1>🇪🇨 Ecuador Interactivo</h1><small>Mapa interactivo de las 24 provincias</small></div>
<small id="status">Mapa listo</small>
</header>
<div class="app">
<aside>
<input id="search" placeholder="🔎 Buscar provincia...">
<select id="select"></select>
<div class="list" id="list"></div>
</aside>
<main class="mapbox">
<div class="tools"><button onclick="zoom(1)">＋</button><button onclick="zoom(-1)">−</button><button onclick="resetZoom()">↺</button></div>
<svg id="map" viewBox="0 0 720 740" aria-label="Mapa interactivo de Ecuador"></svg>
<div class="legend">🟠 seleccionada · 🟢 al pasar el cursor</div>
</main>
<section class="details" id="details"></section>
</div>
